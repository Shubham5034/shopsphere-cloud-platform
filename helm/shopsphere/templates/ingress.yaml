{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ include "shopsphere.fullname" . }}-ingress

  labels:
    {{- include "shopsphere.labels" . | nindent 4 }}

  annotations:
    alb.ingress.kubernetes.io/target-type: ip

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - host: {{ .Values.ingress.host }}

      http:
        paths:

          - path: /
            pathType: Prefix

            backend:
              service:
                name: {{ include "shopsphere.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}

          - path: /api
            pathType: Prefix

            backend:
              service:
                name: {{ include "shopsphere.fullname" . }}-user-service
                port:
                  number: {{ .Values.userService.service.port }}

{{- end }}
