version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: shopsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - shopsphere-network

  user-service:
    build:
      context: ./app/user-service
    container_name: shopsphere-user-service
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL} 
    ports:
      - "8000:8000"
    networks:
      - shopsphere-network

  frontend:
    build:
      context: ./app/frontend
    container_name: shopsphere-frontend
    restart: unless-stopped
    depends_on:
      - user-service
    ports:
      - "5173:5173"
    networks:
      - shopsphere-network

volumes:
  postgres-data:

networks:
  shopsphere-network:
    driver: bridge
