version: "3.9"

services:

  postgres:
    image: postgres:17

    container_name: shopsphere-postgres

    restart: always

    environment:
      POSTGRES_DB: shopsphere
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - shopsphere-network

volumes:
  postgres-data:

networks:
  shopsphere-network:
