apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service
  namespace: shopsphere

spec:
  replicas: 2

  selector:
    matchLabels:
      app: user-service

  template:

    metadata:
      labels:
        app: user-service

    spec:

      containers:

      - name: user-service

        image: shopsphere-user-service:latest

        imagePullPolicy: Never

        ports:

        - containerPort: 8000

        envFrom:

        - configMapRef:
            name: shopsphere-config

        - secretRef:
            name: shopsphere-secret

        resources:

          requests:
            cpu: "250m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:

          httpGet:
            path: /ready
            port: 8000

          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:

          httpGet:
            path: /health
            port: 8000

          initialDelaySeconds: 10
          periodSeconds: 15
